<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-label="Two blocks of crust, one denser than the other.">
  <title>Crust blocks</title>
  <desc>The oceanic block sits lower because it is denser.</desc>
  <g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <rect class="face-a" x="10" y="40" width="80" height="50" rx="4" ry="4"/>
    <rect class="face-b" x="110" y="20" width="80" height="70" rx="4"/>
    <circle class="face-c" cx="150" cy="10" r="6"/>
  </g>
  <text x="50" y="110" text-anchor="middle" font-size="10">OCEANIC</text>
  <text x="150" y="110" text-anchor="middle" font-size="10">CONTINENTAL</text>
</svg>
